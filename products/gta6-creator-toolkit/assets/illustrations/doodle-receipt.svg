<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" role="img" aria-labelledby="t d"><title id="t">CPM receipt</title><desc id="d">A paper receipt for the fictional clip: 48,600 verified views at $1.00 per 1,000 equals $48.60, within the $3 minimum and $150 maximum, minus a 10% fee of $4.86, net $43.74 before withdrawal fees.</desc><path d="M40,40 L720,40 L720,960 L690,982 L660,960 L630,982 L600,960 L570,982 L540,960 L510,982 L480,960 L450,982 L420,960 L390,982 L360,960 L330,982 L300,960 L270,982 L240,960 L210,982 L180,960 L150,982 L120,960 L90,982 L60,960 L40,960 Z" fill="#FFFFFF" stroke="#21152E" stroke-width="4"/><text x="380.0" y="120" text-anchor="middle" style="font-family:'Barlow Condensed',sans-serif;font-weight:800" font-size="64" fill="#21152E">CLIP RECEIPT</text><text x="380.0" y="170" text-anchor="middle" style="font-family:'Inter',sans-serif" font-size="28" fill="#8659D5">Fictional example · Rexa Live</text><path d="M80,200 L680,200" stroke="#21152E" stroke-width="3" stroke-dasharray="10 8"/><text x="80" y="270" style="font-family:'Inter',sans-serif" font-size="44" fill="#21152E">Verified views</text><text x="680" y="270" text-anchor="end" style="font-family:'Inter',sans-serif;font-weight:700" font-size="44" fill="#21152E">48,600</text><text x="80" y="360" style="font-family:'Inter',sans-serif" font-size="44" fill="#21152E">Rate</text><text x="680" y="360" text-anchor="end" style="font-family:'Inter',sans-serif;font-weight:700" font-size="44" fill="#21152E">$1.00 / 1,000</text><text x="80" y="450" style="font-family:'Inter',sans-serif" font-size="44" fill="#21152E">48.6 × $1.00</text><text x="680" y="450" text-anchor="end" style="font-family:'Inter',sans-serif;font-weight:700" font-size="44" fill="#21152E">$48.60</text><text x="80" y="540" style="font-family:'Inter',sans-serif" font-size="44" fill="#21152E">Min $3 · Max $150</text><text x="680" y="540" text-anchor="end" style="font-family:'Inter',sans-serif;font-weight:700" font-size="44" fill="#21152E">OK</text><text x="80" y="630" style="font-family:'Inter',sans-serif" font-size="44" fill="#21152E">Fee 10%</text><text x="680" y="630" text-anchor="end" style="font-family:'Inter',sans-serif;font-weight:700" font-size="44" fill="#21152E">− $4.86</text><path d="M80,720 L680,720" stroke="#21152E" stroke-width="3"/><text x="90" y="800" style="font-family:'Barlow Condensed',sans-serif;font-weight:800" font-size="60" fill="#21152E">NET</text><text x="670" y="800" text-anchor="end" style="font-family:'Barlow Condensed',sans-serif;font-weight:800" font-size="72" fill="#8659D5">$43.74</text><text x="380.0" y="880" text-anchor="middle" style="font-family:'Inter',sans-serif" font-size="26" fill="#21152E">before any withdrawal fees</text><path d="M471.2,758.7 L474.8,753.3 L478.2,747.7 L483.0,742.1 L495.8,739.1 L505.3,735.2 L514.8,731.2 L523.2,726.1 L538.2,725.8 L548.7,721.2 L562.4,720.0 L576.7,721.3 L590.0,719.2 L603.7,719.8 L617.2,720.8 L632.4,719.8 L642.0,725.6 L653.6,728.4 L670.5,728.1 L678.0,733.7 L686.2,738.3 L696.0,742.4 L703.8,747.2 L715.8,751.3 L713.7,758.0 L717.5,763.5 L723.5,769.1 L724.0,775.0 L727.6,781.1 L724.3,787.1 L715.9,792.3 L709.6,797.5 L709.2,804.1 L702.8,809.7 L686.3,811.7 L681.7,818.1 L671.4,822.4 L658.2,825.0 L643.7,826.0 L632.7,830.6 L618.6,831.9 L603.8,830.6 L590.0,832.9 L576.1,830.8 L562.8,829.2 L548.5,829.0 L535.4,826.9 L522.5,824.5 L509.0,822.2 L496.4,819.0 L485.0,815.0 L475.5,810.2 L467.1,805.0 L462.2,799.1 L461.6,792.7 L459.1,786.8 L452.2,781.1 L452.1,775.0 L451.4,768.8 L459.5,763.3 L462.0,757.4 L460.0,750.5 L469.5,745.6 L476.6,740.1 L490.3,737.0 L498.1,731.8 L506.0,726.1 L519.9,723.6 L531.4,719.4 L548.0,720.4" fill="none" stroke="#F575A6" stroke-width="6"/></svg>
