<title>Creative Cut Founder OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed charcoal sidebar + calm light work surface; dense cards, data in mono numerals. */
:root {
  --bg: #F3F6F4; --surface: #FFFFFF; --surface-2: #EDF2EF; --line: #DCE4DF; --line-2: #C9D5CE;
  --fg: #101816; --muted: #5A6A63; --accent: #18A66A; --accent-ink: #0D7A4B; --accent-soft: #E1F3EA; --on-accent: #FFFFFF;
  --ok: #18A66A; --ok-soft: #E1F3EA; --warn: #A86A12; --warn-soft: #FAF0DC; --crit: #BE3D2A; --crit-soft: #FBE7E2; --info: #2D6B9F; --info-soft: #E2EDF7;
  --side: #101816; --side-2: #18221F; --side-fg: #E5EDE9; --side-muted: #8EA198;
  --c1: #18A66A; --c2: #2D6B9F; --c3: #C98A1E; --c4: #B7C4BD;
  --shadow: 0 1px 2px rgba(16,24,22,.06), 0 4px 14px rgba(16,24,22,.05);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1110; --surface: #121A18; --surface-2: #18231F; --line: #23302B; --line-2: #2F3E38;
  --fg: #E6EEEA; --muted: #91A39B; --accent: #22B877; --accent-ink: #4DD095; --accent-soft: #12301F; --on-accent: #06120C;
  --ok: #3CC487; --ok-soft: #12301F; --warn: #E2AC4E; --warn-soft: #33270F; --crit: #F07D67; --crit-soft: #3A1B15; --info: #74AEE0; --info-soft: #132739;
  --side: #080D0C; --side-2: #121A18; --side-fg: #E5EDE9; --side-muted: #85978F;
  --c1: #2EC07F; --c2: #6FA7DA; --c3: #E2AC4E; --c4: #3A4A44; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1110; --surface: #121A18; --surface-2: #18231F; --line: #23302B; --line-2: #2F3E38;
  --fg: #E6EEEA; --muted: #91A39B; --accent: #22B877; --accent-ink: #4DD095; --accent-soft: #12301F; --on-accent: #06120C;
  --ok: #3CC487; --ok-soft: #12301F; --warn: #E2AC4E; --warn-soft: #33270F; --crit: #F07D67; --crit-soft: #3A1B15; --info: #74AEE0; --info-soft: #132739;
  --side: #080D0C; --side-2: #121A18; --side-fg: #E5EDE9; --side-muted: #85978F;
  --c1: #2EC07F; --c2: #6FA7DA; --c3: #E2AC4E; --c4: #3A4A44; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; line-height: 1.2; } h2 { font-size: 1.1rem; } h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; } button { font: inherit; color: inherit; } a { color: var(--accent-ink); }
.muted { color: var(--muted); } .sm { font-size: .86rem; } .xs { font-size: .76rem; } .mono { font-family: var(--f-mono); }
.num, .tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .92em; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.risk { color: var(--crit); font-size: .82rem; } .nc { color: var(--muted); font-weight: 400; font-style: italic; }
.row { display: flex; align-items: center; } .between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .gap-s { gap: 8px; }
.pad { margin-top: 10px; } .pad-s { padding: 4px 0; } .stack { display: grid; gap: 16px; align-content: start; min-width: 0; } .stack-s { display: grid; gap: 6px; }
.w60 { width: 64px; } .w100 { width: 110px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* shell */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-fg); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: max(18px, env(safe-area-inset-top, 0px)) 12px 14px max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; z-index: 30; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 8px 18px; }
.brand strong { display: block; font-family: var(--f-display); font-size: 1.02rem; letter-spacing: -.01em; }
.brand span:not(.mark) { font-size: .74rem; color: var(--side-muted); }
.mark { width: 34px; height: 34px; border-radius: 9px; background: #18A66A; color: #fff; display: grid; place-items: center; font: 700 .82rem var(--f-display); letter-spacing: .02em; flex: none; }
.side nav { display: grid; gap: 2px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: none; border-radius: 8px; color: var(--side-muted); text-align: left; cursor: pointer; font-size: .9rem; transition: background .15s, color .15s; }
.nav:hover { background: var(--side-2); color: var(--side-fg); }
.nav.on { background: var(--side-2); color: #fff; box-shadow: inset 2px 0 0 #18A66A; }
.nav.on .ic { color: #3FD08F; }
.nav span { flex: 1; } .nbadge { font-style: normal; font: 500 .7rem var(--f-mono); background: #5A2A21; color: #FFD3C9; border-radius: 99px; padding: 1px 7px; }
.side-foot { margin-top: auto; padding-top: 14px; }
.src { display: flex; gap: 8px; align-items: flex-start; font-size: .74rem; color: var(--side-muted); background: var(--side-2); border-radius: 8px; padding: 10px; }
.src b { display: block; color: var(--side-fg); font-weight: 600; } .src span { display: block; }
.src-cloud .ic { color: #3FD08F; } .src-warn .ic { color: #E2AC4E; }
.main { min-width: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.top-src { display: flex; align-items: center; gap: 6px; font-size: .8rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-src span { overflow: hidden; text-overflow: ellipsis; }
.top .menu-b { display: none; }
.qa-w { position: relative; } .qa { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; min-width: 200px; display: grid; z-index: 40; }
.qa button { display: flex; gap: 10px; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
.qa button:hover { background: var(--surface-2); }
.content { padding-block: 24px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); max-width: 1440px; }
.page { display: grid; gap: 18px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h > div:first-child { max-width: 70ch; min-width: 0; } .page-h p.muted { margin-top: 6px; }
.sec { margin-top: 6px; }
.scrim { display: none; }

/* cards & stats */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-t { min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.stats-s { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; display: grid; gap: 4px; align-content: start; min-width: 0; }
.stat.clickable { cursor: pointer; transition: border-color .15s, transform .15s; } .stat.clickable:hover { border-color: var(--accent); }
.stat-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.stat-l { font-size: .78rem; color: var(--muted); }
.stat-v { font: 600 1.38rem/1.2 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat-v.is-empty { color: var(--muted); font-size: 1.05rem; } .stat-s { font-size: .74rem; color: var(--muted); }
.stat.tone-crit { border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); } .stat.tone-crit .stat-v { color: var(--crit); }
.stat.tone-warn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); } .stat.tone-accent .stat-v { color: var(--accent-ink); }
.tag { font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.tag-actual { background: var(--ok-soft); color: var(--accent-ink); } .tag-target { background: var(--info-soft); color: var(--info); }
.tag-est { background: var(--warn-soft); color: var(--warn); } .tag-config, .tag-calc { background: var(--surface-2); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; padding: 2px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill-ok { background: var(--ok-soft); color: var(--accent-ink); } .pill-warn { background: var(--warn-soft); color: var(--warn); } .pill-crit { background: var(--crit-soft); color: var(--crit); }
.pill-info { background: var(--info-soft); color: var(--info); } .pill-accent { background: var(--accent-soft); color: var(--accent-ink); }
.prog { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; } .prog-f { height: 100%; border-radius: 99px; transition: width .3s; }
.tone-bg-accent, .tone-bg-ok { background: var(--accent); } .tone-bg-warn { background: var(--warn); } .tone-bg-crit { background: var(--crit); } .tone-bg-info { background: var(--info); } .tone-bg-muted { background: var(--c4); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.brief { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; align-items: start; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: .88rem; margin-bottom: 8px; }
.kv > span { color: var(--muted); } .kv > b { text-align: right; font-weight: 600; }
.kv-2 { grid-template-columns: minmax(120px, auto) minmax(0, 1fr); } .kv-2 > b { text-align: left; }
.big { font: 600 2.4rem var(--f-display); }
.ulist, .olist { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.note { font-size: .82rem; background: var(--surface-2); padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; color: var(--muted); }
.warn-note { background: var(--warn-soft); color: var(--warn); }
.empty { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px dashed var(--line-2); border-radius: var(--r); color: var(--muted); flex-wrap: wrap; }
.empty strong { color: var(--fg); display: block; } .empty > div { flex: 1; min-width: 180px; }

/* buttons, inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: .88rem; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--accent); } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); } .btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }
.btn-ghost { background: transparent; border-color: transparent; } .btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); } .btn-danger:hover { background: var(--crit-soft); border-color: var(--crit); }
.btn-sm { padding: 4px 9px; font-size: .8rem; }
.inp { font: inherit; font-size: .88rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 9px; min-width: 0; max-width: 100%; }
textarea.inp { width: 100%; resize: vertical; } .inp:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); border-color: var(--accent); }
.sel-s { padding: 3px 6px; font-size: .78rem; }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 0; font-size: .88rem; flex-wrap: wrap; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tabs { display: inline-flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; flex-wrap: wrap; max-width: 100%; }
.tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: .86rem; color: var(--muted); white-space: nowrap; }
.tabs button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); font-weight: 500; }
.tabs-s button { padding: 4px 9px; font-size: .8rem; }
.lnk { border: 0; background: none; padding: 0; color: var(--accent-ink); cursor: pointer; text-align: left; font-weight: 500; }
.ext { font-size: .82rem; display: inline-flex; gap: 3px; align-items: center; }

/* lines */
.line { display: flex; gap: 6px 8px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; min-width: 0; flex-wrap: wrap; }
.card > .line:first-of-type, .card-h + .line { border-top: 0; }
button.line { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; text-align: left; }
.line-main { flex: 1 1 200px; min-width: 0; display: grid; gap: 1px; border: 0; background: none; text-align: left; cursor: pointer; padding: 0; }
.line-main:hover .line-t { color: var(--accent-ink); }
.line-t { font-weight: 500; overflow-wrap: anywhere; } .line-a { display: flex; gap: 6px; align-items: center; flex: none; margin-left: auto; }
.line.is-done .line-t { text-decoration: line-through; color: var(--muted); }
.tick input { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }
.sub-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); padding: 0 0 8px 28px; }
.warns { display: grid; gap: 6px; }
.warn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left; font-size: .86rem; width: 100%; margin-bottom: 6px; }
.warns .warn { margin: 0; } .warn span { flex: 1; min-width: 0; }
.warn-crit { border-color: color-mix(in srgb, var(--crit) 35%, var(--line)); } .warn-crit .ic:first-child { color: var(--crit); }
.warn-warn .ic:first-child { color: var(--warn); } .warn-info .ic:first-child { color: var(--info); } .warn-more { color: var(--muted); justify-content: center; }
.cap { display: grid; gap: 4px; margin-bottom: 10px; }
.eve { display: grid; gap: 4px; }
.eve-i { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 0; text-align: left; cursor: pointer; }
.eve-k { font: 500 .74rem var(--f-mono); color: var(--muted); }

/* tables */
.tbl-w { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
.tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: .74rem; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl .r { text-align: right; } .tbl .c { text-align: center; }
.row-crit td { background: var(--crit-soft); } .row-today td { background: var(--accent-soft); }
.heat td, .heat th { padding: 3px; } .hc { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--surface-2); cursor: pointer; }
.hc.on { background: var(--accent); border-color: var(--accent); }

/* kanban */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kcol { background: var(--surface-2); border-radius: var(--r); padding: 8px; display: grid; gap: 8px; min-height: 120px; border: 1px dashed transparent; }
.kcol.over { border-color: var(--accent); } .kcol-blocked { background: color-mix(in srgb, var(--crit-soft) 60%, var(--surface-2)); }
.kcol-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; cursor: grab; }
.kcard.is-crit { border-left: 3px solid var(--crit); } .kcard.is-warn { border-left: 3px solid var(--warn); }
.kcard-b { border: 0; background: none; padding: 0; display: grid; gap: 3px; text-align: left; cursor: pointer; }
.kcard-t { font-weight: 600; font-size: .9rem; overflow-wrap: anywhere; } .kempty { color: var(--muted); font-size: .78rem; text-align: center; padding: 10px; }
.pri { font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); } .pri-High, .pri-Critical { color: var(--crit); }

/* calendar */
.cal-w { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(96px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 700px; }
.cal-h { background: var(--surface-2); padding: 6px; font-size: .74rem; color: var(--muted); text-align: center; }
.cal-d { background: var(--surface); min-height: 96px; padding: 4px; display: grid; gap: 3px; align-content: start; }
.cal-d.out { background: var(--bg); } .cal-d.out .cal-n { color: var(--muted); } .cal-d.sprint { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
.cal-d.today .cal-n { background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 0 6px; }
.cal-n { font-size: .74rem; justify-self: start; }
.cal-i { border: 0; text-align: left; font-size: .7rem; padding: 2px 5px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--surface-2); }
.st-ok { background: var(--ok-soft); color: var(--accent-ink); } .st-crit { background: var(--crit-soft); color: var(--crit); } .st-warn { background: var(--warn-soft); color: var(--warn); } .st-info { background: var(--info-soft); color: var(--info); } .st-accent { background: var(--accent-soft); color: var(--accent-ink); }

/* sprint days */
.days { display: grid; grid-template-columns: repeat(9, minmax(118px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.dayb { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px; text-align: left; display: grid; gap: 4px; cursor: pointer; align-content: start; }
.dayb.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); } .dayb.today .xs:first-child { color: var(--accent-ink); font-weight: 600; }
.dayb-t { font-size: .8rem; font-weight: 600; line-height: 1.25; min-height: 2.5em; }
.note-blk { border-top: 1px solid var(--line); padding: 8px 0; display: grid; gap: 6px; } .note-blk:first-of-type { border-top: 0; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; } .chart .base { stroke: var(--line-2); }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--f-mono); }
