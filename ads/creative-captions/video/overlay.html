<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Never Ever Overlay</title>
<!-- Transparent motion-graphics layer for the 30 s ad. build.js calls window.render(t) for each frame
     and composites the PNGs over the real AE footage. It contains no UI imitation, only text, rings and frames. -->
<link rel="stylesheet" href="../static/ad.css">
<style>
  html, body { width: 1080px; height: 1920px; padding: 0; background: transparent !important; }
  .it { position: absolute; will-change: transform, opacity; opacity: 0; }
  .anton { font-family: "Anton", Impact, sans-serif; text-transform: uppercase; line-height: .95; }
  .lime { color: var(--lime); }
  .shadow { text-shadow: 0 6px 30px rgba(0,0,0,.65); }
  .chip {
    display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 14px;
    background: rgba(10,13,11,.88); border: 2px solid var(--line); font-weight: 800; font-size: 38px; color: var(--paper);
  }
  .chip.sm { font-size: 30px; padding: 8px 18px; }
  .chip.on { background: var(--lime); color: var(--ink); border-color: var(--lime); }
  .chip small { font-weight: 700; font-size: 24px; opacity: .75; letter-spacing: .08em; }
  .card { position: absolute; border: 3px solid rgba(200,245,60,.55); border-radius: 18px; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 30px 80px rgba(0,0,0,.45); }
  .ring { position: absolute; border: 6px solid var(--lime); border-radius: 50%; box-shadow: 0 0 30px rgba(200,245,60,.6); }
  .ring b { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 14px); white-space: nowrap;
    background: var(--lime); color: var(--ink); font-weight: 800; font-size: 28px; padding: 6px 14px; border-radius: 10px; }
  .speed { font-weight: 800; font-size: 24px; letter-spacing: .08em; padding: 8px 14px; border-radius: 10px;
    background: rgba(10,13,11,.9); color: var(--lime); border: 1px solid var(--line); }
  .slate { border-radius: 18px; }
  .slate b { font-size: 40px; }
  .slate code { font-size: 26px; }
  .slate span { font-size: 24px; }
  .dim { position: absolute; inset: 0; background: rgba(10,13,11,.86); opacity: 0; }
  .btn { background: var(--lime); color: var(--ink); border-radius: 22px; padding: 30px 0; text-align: center;
    font-family: "Anton"; font-size: 64px; letter-spacing: .01em; width: 960px; }
  body.draft .draft-banner { top: 47%; font-size: 34px; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="draft-banner">PLACEHOLDER FOOTAGE · AWAITING REAL AE CAPTURES · NOT FOR PUBLISHING</div>
<script>
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const back = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const stage = document.getElementById("stage");
const items = [];

function add(t0, t1, html, css, anim = "up", cls = "") {
  const el = document.createElement("div");
  el.className = "it " + cls;
  el.innerHTML = html;
  Object.assign(el.style, css);
  stage.appendChild(el);
  items.push({ el, t0, t1, anim });
  return el;
}

window.setup = function (TL) {
  if (TL.draft) document.body.classList.add("draft");
  const L = 60; // left margin; all key copy sits between y 270 and y 1250 (Reels safe area)

  // footage cards / slates / sped-up labels (positions come from build.js so they hug the real footage)
  TL.segments.forEach((s) => {
    const [x, y, w, h] = s.rect;
    if (s.missing) {
      add(s.t0, s.t1, `<div class="slate" style="position:absolute;inset:0"><b>REAL AE CAPTURE NEEDED</b><code>captures/${s.src}</code><span>${s.need}</span></div>`,
        { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }, "cut");
    } else if (s.id !== "final") {
      add(s.t0, s.t1, "", { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }, "cut", "card");
    }
    if (s.spedUp) add(s.t0, s.t1, `<span class="speed">PROCESSING SPED UP ×${s.speed.toFixed(1)}</span>`,
      { left: (x + 18) + "px", top: (y + h - 62) + "px" }, "fade");
    if (s.style) add(s.t0, s.t1, `<span class="chip on"><small>${s.styleIndex}/3</small>${s.style}</span>`,
      { left: (x + 18) + "px", top: (y + 18) + "px" }, "pop");
  });

  // 0–3 hook
  add(0.1, 3.0, `<div class="anton shadow" style="font-size:190px">Never</div>`, { left: L + "px", top: "290px" }, "slam");
  add(0.6, 3.0, `<div class="anton shadow lime" style="font-size:190px">ever</div>`, { left: "560px", top: "290px" }, "slam");
  // 3–6 complete the thought
  add(3.0, 6.0, `<div class="anton" style="font-size:64px;color:var(--muted)">Never ever</div>`, { left: L + "px", top: "285px" }, "fade");
  add(3.1, 6.0, `<div style="font-weight:800;font-size:58px" class="shadow">let captions become</div>`, { left: L + "px", top: "360px" }, "up");
  add(3.5, 6.0, `<div class="anton lime shadow" style="font-size:118px">a second edit.</div>`, { left: L + "px", top: "430px" }, "slam");
  // 6–12 product + steps
  add(6.0, 12.0, `<div style="display:flex;align-items:center;gap:18px"><img src="../assets/brand/creative-cut-tools-mark-256.png" style="width:78px;height:78px"><div><div style="font-weight:800;font-size:46px">Creative Captions</div><div style="font-size:26px;color:var(--muted);font-weight:600">inside After Effects</div></div></div>`,
    { left: L + "px", top: "290px" }, "up");
  const steps = [["1", "Pick footage", 6.2, 7.0], ["2", "Language + style", 7.0, 7.6], ["3", "Generate", 7.6, 9.0]];
  steps.forEach(([n, label, a, b], i) => {
    const pos = { left: L + "px", top: (392 + i * 64) + "px" };
    add(a, 12.0, `<span class="chip sm"><small>${n}</small>${label}</span>`, pos, "pop");
    add(a, b, `<span class="chip sm on"><small>${n}</small>${label}</span>`, { ...pos }, "fade");
  });
  add(9.4, 12.0, `<div class="anton shadow" style="font-size:72px">Word-timed. <span class="lime">Editable text layers.</span></div>`,
    { left: L + "px", top: "1258px", width: "960px" }, "up");
  // 12–18 styles
  add(12.0, 18.0, `<div class="anton shadow" style="font-size:96px">Same clip.<br><span class="lime">Three styles.</span></div>`, { left: L + "px", top: "300px" }, "up");
  // 18–24 correction
  add(18.0, 21.2, `<div class="anton shadow" style="font-size:120px">Client<br>revision?</div>`, { left: L + "px", top: "300px" }, "slam");
  add(21.2, 24.0, `<div class="anton lime shadow" style="font-size:120px">Keep<br>editing.</div>`, { left: L + "px", top: "300px" }, "slam");
  add(19.0, 24.0, `<span class="chip"><s style="opacity:.6">SUNDAY</s>&nbsp;→&nbsp;<span class="lime">SATURDAY</span></span>`, { left: "560px", top: "470px" }, "pop");
  add(21.4, 24.0, `<div style="font-weight:800;font-size:44px" class="shadow">One text layer. One word.</div>`, { left: L + "px", top: "1258px" }, "up");
  // 24–27 result
  add(24.2, 27.0, `<div class="anton shadow" style="font-size:120px">Your next reel.<br><span class="lime">Captioned.</span></div>`, { left: L + "px", top: "300px" }, "up");
  // 27–30 end card
  add(27.0, 30.5, "", { inset: "0" }, "fade", "dim");
  add(27.05, 30.5, `<img src="../assets/brand/creative-cut-tools-mark-256.png" style="width:150px;height:150px">`, { left: "465px", top: "330px" }, "pop");
  add(27.15, 30.5, `<div style="text-align:center;width:1080px"><div style="font-weight:800;font-size:56px">Creative Captions</div><div style="font-size:32px;color:var(--muted);font-weight:600;margin-top:6px">for After Effects</div></div>`, { left: "0", top: "510px" }, "up");
  add(27.35, 30.5, `<div class="btn">START YOUR 7-DAY PRO TRIAL</div>`, { left: "60px", top: "700px" }, "slam");
  add(27.6, 30.5, `<div style="text-align:center;width:1080px;font-weight:800;font-size:50px">No card needed.</div>`, { left: "0", top: "880px" }, "up");
  add(27.8, 30.5, `<div style="text-align:center;width:1080px;font-weight:800;font-size:54px" class="lime">tools.creativecut.in</div>`, { left: "0", top: "980px" }, "up");
  add(28.0, 30.5, `<div style="text-align:center;width:1080px;font-weight:600;font-size:34px;color:var(--muted)">After Effects required.</div>`, { left: "0", top: "1080px" }, "up");

  // callout rings (positions are set in edl.json to land on the real controls)
  TL.callouts.forEach((c) => {
    const d = c.r * 2;
    add(c.t0, c.t1, `<b>${c.label}</b>`, { left: (c.at[0] - c.r) + "px", top: (c.at[1] - c.r) + "px", width: d + "px", height: d + "px" }, "ring", "ring");
  });
};

window.render = function (t) {
  for (const it of items) {
    const { el, t0, t1, anim } = it;
    if (t < t0 || t >= t1) { el.style.opacity = 0; continue; }
    const a = (t - t0), out = Math.min(1, (t1 - t) / 0.18);
    let o = 1, tr = "";
    switch (anim) {
      case "cut": o = 1; break;
      case "fade": o = ease(a / 0.25) * out; break;
      case "up": o = ease(a / 0.3) * out; tr = `translateY(${(1 - ease(a / 0.35)) * 40}px)`; break;
      case "pop": o = Math.min(1, a / 0.1) * out; tr = `scale(${0.7 + 0.3 * back(a / 0.28)})`; break;
      case "slam": { const p = ease(a / 0.18); o = Math.min(1, a / 0.06) * out; tr = `scale(${1.35 - 0.35 * p})`; break; }
      case "ring": { const p = back(a / 0.3); o = Math.min(1, a / 0.1) * out; tr = `scale(${0.4 + 0.6 * p})`; break; }
    }
    el.style.opacity = o;
    el.style.transform = tr;
    el.style.transformOrigin = anim === "ring" ? "50% 50%" : "0% 50%";
  }
};
</script>
</body>
</html>
